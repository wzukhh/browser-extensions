<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X → 小红书草稿</title><link rel="stylesheet" href="editor.css"></head><body>
<header><strong>X → 小红书草稿</strong><span id="status">准备中</span><button id="newDraft">草稿列表</button></header>
<main>
  <section class="images"><h2>截图与封面</h2><p id="source"></p><p id="captureWarning" class="warning" hidden></p><div class="preview"><div><h3>信息流封面预览</h3><canvas id="cover" width="900" height="1200"></canvas></div><div><h3>原始截图</h3><img id="original" alt="X 帖子截图"></div></div><div class="row"><label>封面取景位置 <input id="coverPosition" type="range" min="0" max="100" value="50"></label><label><input id="coverTextEnabled" type="checkbox" checked> 添加封面引导语</label></div><input id="coverText" placeholder="封面引导语，可修改或清空"><p class="hint">长图封面按宽度放大并截取局部；完整的原始截图单独保存。请检查是否截全。</p></section>
  <section class="copy"><h2>标题与正文</h2><div class="row"><label>DeepSeek API Key <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"></label><button id="saveKey">保存密钥</button></div><p class="hint">密钥只存于此浏览器。生成时将帖子文字与截图发送给 DeepSeek。</p><div class="row"><button id="generate" class="primary">AI 生成标题、正文、标签</button><button id="regenerate">重新生成</button></div><div id="candidates" class="candidates"></div><label>标题 <span id="titleCount">0/20</span><input id="title" maxlength="40" placeholder="最多 20 字"></label><label>正文 <small>可留空</small><textarea id="body" rows="7" placeholder="标题已讲清内容时可不写正文"></textarea></label><label>标签 <small>以 # 开头，空格分隔</small><input id="tags" placeholder="#有趣的事 #生活观察"></label><label>核对提示<textarea id="checks" rows="3" placeholder="核对出处、图片归属与未证实的信息"></textarea></label><div class="row"><button id="saveDraft" class="primary">保存草稿</button><button id="downloadCover">下载封面</button><button id="downloadOriginal">下载原始截图</button></div></section>
</main><section id="drafts" class="drafts" hidden><h2>已保存草稿</h2><div id="draftList"></div></section>
<script src="editor.js"></script></body></html>
